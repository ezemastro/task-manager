services:
  task-manager:
    image: 'ezemastro/task-manager:latest'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test:
        - CMD
        - wget
        - '--quiet'
        - '--tries=1'
        - '--spider'
        - 'http://127.0.0.1:3000/api/health'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
